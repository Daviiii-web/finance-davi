<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14795d" />
    <meta name="description" content="Poupaê: organize suas receitas e despesas e acompanhe sua vida financeira com clareza." />
    <title>Poupaê</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light flash.
      try {
        const saved = localStorage.getItem('poupae-theme')
          ?? localStorage.getItem('poupaê-theme')
          ?? localStorage.getItem('finance-davi-theme');
        const theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101915' : '#14795d';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
